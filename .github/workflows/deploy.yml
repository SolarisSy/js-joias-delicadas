name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Toda foto em imagens/ com nome de peça vira produto da grade
      - name: Gerar catálogo a partir de imagens/
        run: node tools/gerar-catalogo.mjs

      # feed.xml para o Commerce Manager (Facebook/Instagram) buscar
      - name: Gerar feed de dados
        run: node tools/gerar-feed.mjs

      # ?v=<sha> nas tags: alteração do painel aparece sem esperar o cache do Pages
      - name: Versionar assets contra cache
        run: node tools/versionar-assets.mjs "$GITHUB_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
